<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontak & Share | Fajar</title>
<link rel="canonical" href="https://fajartris17.github.io/kontak.html">
<meta name="theme-color" content="#071427">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{background:#071427}</style>
</head>
<body class="text-slate-100">
<main class="max-w-md mx-auto px-4 py-10">
  <div class="text-center">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-500/20 flex items-center justify-center text-3xl text-emerald-300"><i class="fas fa-share-nodes"></i></div>
    <p class="text-emerald-400 text-xs font-semibold tracking-widest uppercase mt-4">Kontak</p>
    <h1 class="text-3xl font-bold mt-1">Share Link-I</h1>
    <p class="text-slate-400 text-sm mt-2">Kirim ke nomor baru tanpa simpan, atau pilih kontak WhatsApp.</p>
  </div>

  <section class="mt-6 rounded-2xl bg-slate-950 border border-emerald-500/30 p-4">
    <label class="text-xs text-slate-400">Nomor tujuan</label>
    <div class="flex gap-2 mt-2">
      <input id="waNum" type="tel" inputmode="numeric" placeholder="08xx atau 62xxx" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-sm">
      <button type="button" id="waSend" class="bg-emerald-600 px-4 rounded-xl font-medium">Kirim</button>
    </div>
    <div class="grid grid-cols-2 gap-2 mt-3">
      <button type="button" id="waPick" class="bg-slate-800 border border-slate-600 rounded-xl px-3 py-3 text-sm"><i class="fab fa-whatsapp text-emerald-400"></i> Pilih kontak</button>
      <button type="button" id="waCopy" class="bg-slate-800 border border-slate-600 rounded-xl px-3 py-3 text-sm">Salin link</button>
    </div>
  </section>

  <section class="mt-4 grid grid-cols-2 gap-2 text-sm">
    <a class="bg-emerald-700 rounded-xl p-4 text-center" href="https://wa.me/6281356510403"><i class="fab fa-whatsapp block text-xl mb-1"></i>Chat Fajar</a>
    <a class="bg-slate-950 border border-slate-700 rounded-xl p-4 text-center" href="mailto:fajartris1994@gmail.com"><i class="fas fa-envelope block text-xl mb-1 text-sky-300"></i>Email</a>
    <a class="bg-slate-950 border border-slate-700 rounded-xl p-4 text-center" href="payment.html"><i class="fas fa-qrcode block text-xl mb-1 text-amber-300"></i>Payment</a>
    <a class="bg-slate-950 border border-slate-700 rounded-xl p-4 text-center" href="links.html"><i class="fas fa-link block text-xl mb-1 text-cyan-300"></i>Link-I</a>
  </section>
</main>
<script>
(function(){
  var LINK='https://fajartris17.github.io/links.html';
  var TEXT=encodeURIComponent('Link-I Fajar Tri Suhartono:\n'+LINK);
  function to62(raw){var n=String(raw||'').replace(/[^0-9]/g,'');if(!n)return '';if(n.indexOf('62')===0)return n;if(n.indexOf('0')===0)return '62'+n.slice(1);return '62'+n;}
  document.getElementById('waSend').onclick=function(){var n=to62(document.getElementById('waNum').value);if(!n||n.length<10){alert('Isi nomor, contoh 081356510403');return;}location.href='https://wa.me/'+n+'?text='+TEXT;};
  document.getElementById('waPick').onclick=function(){location.href='https://wa.me/?text='+TEXT;};
  document.getElementById('waCopy').onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(LINK).then(function(){alert('Link disalin');});else prompt('Salin link:',LINK);};
})();
</script>
</body>
</html>
