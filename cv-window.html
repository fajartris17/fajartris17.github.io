<!DOCTYPE html>
<html lang="en">
<head>

<title>Window CV · Fajar Tri Suhartono</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<main class="max-w-5xl mx-auto px-4 py-6">
  <p class="text-center text-red-300 text-xs uppercase tracking-wider font-semibold">Window CV</p>
  <h1 class="text-2xl font-bold text-center mt-1">CV English — 02 EN</h1>
  <p class="text-center text-slate-400 text-sm mt-1 mb-4">Fajar Tri Suhartono · Site Manager / Construction Supervisor · target MEP BIM</p>
  <div class="flex flex-wrap justify-center gap-2 mb-4 text-sm">
    <a class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700" href="links.html">← Link-I</a>
    <a class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700" href="documents.html">Dokumen pendukung</a>
    <a id="dl" class="px-4 py-2 rounded-xl bg-red-600 font-semibold" href="CV_Fajar_Tri_Suhartono_EN.pdf.b64" download="CV_Fajar_Tri_Suhartono_EN.pdf">Unduh PDF EN</a>
    <a class="px-4 py-2 rounded-xl bg-emerald-700 font-semibold" href="portfolio-mep-bim.html">Data pendukung</a>
  </div>
  <iframe id="pdf" class="w-full rounded-xl border border-slate-700 bg-white" style="height:80vh" title="CV English"></iframe>
</main>
<script>
fetch('CV_Fajar_Tri_Suhartono_EN.pdf.b64').then(function(r){return r.text();}).then(function(b64){
  var bin=atob(b64.replace(/\s/g,''));
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  var url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
  document.getElementById('pdf').src=url;
  var a=document.getElementById('dl');
  a.href=url; a.download='CV_Fajar_Tri_Suhartono_EN.pdf';
});
</script>
</body>
</html>
