<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Mentari Pesisir - Dermaga Kayu 50m</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background: #071427; color: #e2e8f0; min-height: 100vh; }
.card img { width: 100%; height: auto; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4); cursor: pointer; background: #0b1220; }
.lb { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:100; align-items:center; justify-content:center; padding: 10px; }
.lb.on { display:flex; }
.lb img { max-height: 92vh; max-width: 96vw; border-radius: 8px; }
.video-wrap { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 16px; background: #000; }
.video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body class="p-4 md:p-8">
<main class="max-w-5xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <a href="/" class="text-cyan-400 text-sm hover:underline">&larr; Home</a>
    <a href="album-kerja.html" class="text-amber-400 text-sm hover:underline">Album Kerja</a>
  </div>

  <h1 class="text-2xl md:text-3xl font-bold text-center">Project Mentari Pesisir</h1>
  <p class="text-center text-slate-400 mt-2 mb-6">Dermaga Kayu 50 Meter · Visualisasi & Gambar Teknik</p>

  <!-- Video di paling atas -->
  <div class="mb-10">
    <h2 class="text-lg font-semibold mb-3 text-center text-cyan-300">Video Animasi</h2>
    <div class="video-wrap shadow-xl">
      <iframe src="https://drive.google.com/file/d/1IdnSO6euEdd15WKDkBjtsb_B7KxtcbhI/preview" allow="autoplay" allowfullscreen></iframe>
    </div>
  </div>

  <div class="grid md:grid-cols-2 gap-6" id="gallery"></div>

  <p class="text-center text-xs text-slate-500 mt-10">Gambar project Mentari Pesisir. Tap untuk memperbesar.</p>
</main>
<div id="lb" class="lb" onclick="this.classList.remove('on')"><img id="lbimg" alt=""></div>
<script>
const items = [
  ["1XYdk1gDPRX0kH5q-yLuuQop0IlQcYexe", "Animasi Frame 1 - Pondasi Tiang"],
  ["1fyk20t0Q4I3Sn32WrIY8TFbthapdUzJh", "Animasi Frame 2 - Struktur Balok"],
  ["1FfcvYwyWb7sidd1lrdOKGwKJ5vLSiMSx", "Animasi Frame 3 - Pengecoran"],
  ["1rA4-IcxI3FcGs4wrSF3o3ILEIdtHr_f8", "Animasi Frame 4 - Selesai"],
  ["1sos7a4J9Lsu9nJZYBac9OvM7-4fFD0dq", "Dermaga 50m - Gabungan 3 View"],
  ["1A0_oK6AnjxQ71XAT9EY1zTP_JomtNHvY", "Dermaga 50m - Gambar Teknik Rapi"],
  ["1SKn6sOxWb2nVUJqeLwFfFNoj8HMFqZfi", "Dermaga 50m - Potongan Melintang 2D"],
  ["1gHoqk_4OFwTDhnVS3jDN04oNZVwe6BZj", "Dermaga 50m - Tampak Kanan 2D"],
  ["1X5gViykw17v0BAn7SHnLszt0_YFJrlV6", "Dermaga 50m - Denah 2D"],
  ["1ujOcAXbxC74XxLbQl-j6FDHCbZIyuYi1", "Denah Jarak Tiang 2m"],
  ["1z6vIzP9YekQyEk0x6nSzgXpbUDmVhhS-", "Detail Struktur Material 3D"],
  ["10Y0Sq92qp6tPe5MiGgmK2-BHSnpW-t7s", "Visualisasi 5D Dermaga"]
];
const gal = document.getElementById('gallery');
items.forEach(([id, title]) => {
  const fig = document.createElement('figure');
  fig.className = 'card bg-slate-900 rounded-2xl overflow-hidden border border-slate-700 p-3';
  fig.innerHTML = `
    <img src="https://lh3.googleusercontent.com/d/${id}=w1600" alt="${title}" 
         onerror="this.onerror=null;this.src='https://drive.google.com/thumbnail?id=${id}&sz=w1600';"
         onclick="openLb(this.src)">
    <figcaption class="mt-2 text-sm font-medium text-center">${title}</figcaption>
  `;
  gal.appendChild(fig);
});
function openLb(src) {
  document.getElementById('lbimg').src = src;
  document.getElementById('lb').classList.add('on');
}
</script>
</body>
</html>
