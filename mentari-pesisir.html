<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Mentari Pesisir - Dermaga Kayu 50m</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background: #071427; color: #e2e8f0; min-height: 100vh; }
.gallery img { width: 100%; height: auto; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4); cursor: pointer; }
.lb { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:100; align-items:center; justify-content:center; padding: 10px; }
.lb.on { display:flex; }
.lb img { max-height: 92vh; max-width: 96vw; border-radius: 8px; }
</style>
</head>
<body class="p-4 md:p-8">
<main class="max-w-5xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <a href="/" class="text-cyan-400 text-sm hover:underline">&larr; Home</a>
    <a href="album-kerja.html" class="text-amber-400 text-sm hover:underline">Album Kerja</a>
  </div>
  <h1 class="text-2xl md:text-3xl font-bold text-center">Project Mentari Pesisir</h1>
  <p class="text-center text-slate-400 mt-2 mb-8">Dermaga Kayu 50 Meter · Visualisasi & Gambar Teknik</p>
  <div class="grid md:grid-cols-2 gap-6" id="gallery"></div>
  <p class="text-center text-xs text-slate-500 mt-10">Gambar project Mentari Pesisir. Tap untuk memperbesar.</p>
</main>
<div id="lb" class="lb" onclick="this.classList.remove('on')"><img id="lbimg" alt=""></div>
<script src="mentari-images.js"></script>
<script>
function b64ToUrl(b64) {
  return 'data:image/jpeg;base64,' + b64;
}
function openLb(src) {
  document.getElementById('lbimg').src = src;
  document.getElementById('lb').classList.add('on');
}
const gal = document.getElementById('gallery');
const images = window.MENTARI_IMAGES || {};
const titles = window.MENTARI_TITLES || {};
Object.keys(images).forEach(key => {
  const url = b64ToUrl(images[key]);
  const fig = document.createElement('figure');
  fig.className = 'bg-slate-900 rounded-2xl overflow-hidden border border-slate-700 p-3';
  fig.innerHTML = `<img src="${url}" alt="${titles[key]||''}" onclick="openLb(this.src)">
    <figcaption class="mt-2 text-sm font-medium text-center">${titles[key]||''}</figcaption>`;
  gal.appendChild(fig);
});
</script>
</body>
</html>
