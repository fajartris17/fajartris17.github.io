<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Pendukung · Portfolio MEP BIM 03</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<main class="max-w-5xl mx-auto px-4 py-6">
  <p class="text-center text-amber-300 text-xs uppercase tracking-wider font-semibold">Data pendukung</p>
  <h1 class="text-2xl font-bold text-center mt-1">Portfolio MEP BIM — 03</h1>
  <p class="text-center text-slate-400 text-sm mt-1 mb-4">Sampel format deliverable 10 halaman (disanitasi). Bukan file model klien.</p>
  <div class="flex flex-wrap justify-center gap-2 mb-4 text-sm">
    <a class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700" href="links.html">← Link-I</a>
    <a class="px-4 py-2 rounded-xl bg-red-700 font-semibold" href="cv-window.html">Window CV</a>
    <a id="dl" class="px-4 py-2 rounded-xl bg-amber-600 font-semibold text-slate-950" href="#">Unduh portfolio PDF</a>
  </div>
  <p id="status" class="text-center text-xs text-slate-400 mb-3">Memuat PDF…</p>
  <iframe id="pdf" class="w-full rounded-xl border border-slate-700 bg-white" style="height:80vh" title="Portfolio MEP BIM"></iframe>
</main>
<script>
(function(){
  var n=6;
  Promise.all(Array.from({length:n},function(_,i){
    return fetch('Portfolio_MEP_BIM_Sanitized.pdf.b64.p'+(i+1)).then(function(r){
      if(!r.ok) throw new Error('part '+(i+1)+' '+r.status);
      return r.text();
    });
  })).then(function(parts){
    var b64=parts.join('').replace(/\s/g,'');
    var bin=atob(b64);
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    document.getElementById('pdf').src=url;
    var a=document.getElementById('dl');
    a.href=url; a.download='03_Portfolio_MEP_BIM_10halaman_Sanitized.pdf';
    document.getElementById('status').textContent='PDF 10 halaman · sampel sanitasi · siap unduh';
  }).catch(function(err){
    document.getElementById('status').textContent='Gagal memuat PDF: '+err.message;
  });
})();
</script>
</body>
</html>
