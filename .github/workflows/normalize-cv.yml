name: Normalize CV PDF

on:
  push:
    paths:
      - ".github/workflows/normalize-cv.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript qpdf

      - name: Inspect and repair CV
        run: |
          set -e
          INPUT="CV_FAJAR_TRI_SUHARTONO_LENGKAP_FINAL_2026.pdf"
          OUTPUT="/tmp/CV_FIXED.pdf"
          echo "Original PDF:"
          pdfinfo "$INPUT" || true
          qpdf --check "$INPUT" || true

          gs -q -o "$OUTPUT" -sDEVICE=pdfwrite \
            -dCompatibilityLevel=1.7 \
            -dPDFSETTINGS=/prepress \
            -sPAPERSIZE=a4 -dFIXEDMEDIA -dPDFFitPage \
            "$INPUT"

          echo "Repaired PDF:"
          pdfinfo "$OUTPUT"

          test -s "$OUTPUT"
          cp "$OUTPUT" "$INPUT"

      - name: Validate repaired PDF
        run: |
          set -e
          pdfinfo "CV_FAJAR_TRI_SUHARTONO_LENGKAP_FINAL_2026.pdf"
          qpdf --check "CV_FAJAR_TRI_SUHARTONO_LENGKAP_FINAL_2026.pdf"

      - name: Commit repaired CV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "CV_FAJAR_TRI_SUHARTONO_LENGKAP_FINAL_2026.pdf"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix CV PDF page size and layout"
          git push
